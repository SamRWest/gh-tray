[project]
name = "gh-tray"
version = "0.1.0"
description = "System tray watcher for GitHub pull request activity, with desktop notifications and a terminal dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=3.0",
    "darkdetect>=0.8.0",
    "desktop-notifier>=6.0",
    "loguru>=0.7",
    "pillow>=10.1",
    "platformdirs>=4.2",
    "pystray>=0.19.5",
    "tksheet>=7.6.0",
]

[project.scripts]
gh-tray = "gh_tray.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_tray"]

[dependency-groups]
dev = ["poethepoet>=0.30", "prek>=0.2", "pytest>=8.0", "ruff>=0.6", "ty>=0.0.1a20"]

# Named jobs, run as `uv run poe <name>`. `uv run poe` on its own lists them.
[tool.poe.tasks]
init = { shell = "uv sync; uv run prek install", help = "Install the dependencies and the pre-commit hooks. Run this after cloning or pulling." }
run = { cmd = "uv run gh-tray", help = "Start the tray" }
once = { cmd = "uv run gh-tray once", help = "Poll a single time and print what it found, without the tray" }
lint = { cmd = "uv run prek run", help = "Run the pre-commit checks on staged files" }
lint_all = { cmd = "uv run prek run --all-files", help = "Run the pre-commit checks on every file, staged or not" }
test = { cmd = "uv run pytest", help = "Run the tests" }
ty = { cmd = "uv run ty check --output-format concise", help = "Run the type checks" }

[tool.ruff]
line-length = 150
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# "S" is the flake8-bandit security rule set, which is what bandit itself implements, so bandit is not installed
# separately. Add `# noqa: S###` to a line to ignore one finding on it.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D", "S"]
# D203 and D213 contradict the docstring style used here. S603 fires on every subprocess call given a list of
# arguments, which is the form that cannot be shell-injected: the risky forms are S602 and S605 and stay on.
ignore = ["D203", "D213", "S603"]

[tool.ruff.lint.per-file-ignores]
# A test says what it means by asserting, and its name says what it covers, so neither wants a docstring.
"tests/*" = ["D103", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.environment]
# Check against what the project actually installs, so a missing annotation in a dependency is not read as an error
# in the code that calls it.
python = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
