<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="gh-tray">
  <title>gh-tray</title>
  <rect width="64" height="64" rx="14" fill="#22272e"/>
  <!-- An open tray, so it reads as something things land in. Kept in step with status.app_icon. -->
  <polyline points="13,36 18,51 46,51 51,36" fill="none" stroke="#adbac7" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three marks landing in it, in the colours the window uses for what wants attention. -->
  <circle cx="21" cy="17" r="4.5" fill="#ff7b72"/>
  <circle cx="32" cy="25" r="4.5" fill="#ffa657"/>
  <circle cx="43" cy="17" r="4.5" fill="#5ddb6f"/>
</svg>
